<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Closer Copilot</title>
    <meta name="description" content="Closer Copilot — live AI sales coaching. It whispers the exact line to say, and it will never say a wrong price or fact." />
    <meta name="theme-color" content="#0c6ce9" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:site_name" content="Closer Copilot" />
    <meta property="og:title" content="Closer Copilot — know exactly what to say, live, on every call" />
    <meta property="og:description" content="Whispered AI sales coaching that hears the objection and hands you the line — and never says a wrong price or fact." />
    <meta property="og:image" content="/og-mark.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Closer Copilot" />
    <meta name="twitter:description" content="Live AI sales coaching that hears the objection and hands you the line." />
    <meta name="twitter:image" content="/og-mark.png" />
    <script>
      // pre-paint theme application — avoids a flash of the wrong theme before React mounts
      try {
        var t = localStorage.getItem('cc-theme');
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
